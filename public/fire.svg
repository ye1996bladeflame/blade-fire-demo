<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bladeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#a0aec0"/>
      <stop offset="100%" stop-color="#4a5568"/>
    </linearGradient>
    <radialGradient id="fireGradient" cx="50%" cy="80%" r="80%">
      <stop offset="0%" stop-color="#ffff00"/>
      <stop offset="30%" stop-color="#ff9900"/>
      <stop offset="70%" stop-color="#ff0000"/>
      <stop offset="100%" stop-color="#550000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 旋转组，让刀呈对角线 -->
  <g transform="translate(256, 256) rotate(45) translate(-256, -256)">
    <!-- 外部火焰光环 -->
    <path d="M256 20 
             C 320 100, 420 200, 400 350 
             C 390 420, 320 480, 256 490 
             C 192 480, 122 420, 112 350 
             C 92 200, 192 100, 256 20 Z" 
          fill="url(#fireGradient)" filter="url(#glow)" opacity="0.9"/>
    
    <!-- 内部火焰核心 -->
    <path d="M256 60 
             C 300 150, 360 250, 340 360 
             C 330 400, 300 440, 256 450 
             C 212 440, 182 400, 172 360 
             C 152 250, 212 150, 256 60 Z" 
          fill="#ff4500" filter="url(#glow)" opacity="0.8"/>

    <!-- 刀身 -->
    <path d="M256 50 L 310 380 L 202 380 Z" fill="url(#bladeGradient)" stroke="#2d3748" stroke-width="4"/>
    
    <!-- 护手 -->
    <path d="M180 380 L 332 380 L 322 400 L 190 400 Z" fill="#d69e2e" stroke="#744210" stroke-width="2"/>
    <circle cx="256" cy="390" r="10" fill="#c05621"/>

    <!-- 刀柄 -->
    <rect x="240" y="400" width="32" height="80" rx="5" fill="#4a5568" stroke="#1a202c" stroke-width="2"/>
    <!-- 刀柄纹理 -->
    <path d="M240 420 L 272 420 M 240 440 L 272 440 M 240 460 L 272 460" stroke="#2d3748" stroke-width="2"/>

    <!-- 刀身血槽 -->
    <path d="M256 100 L 256 350" stroke="#1a202c" stroke-width="3" stroke-linecap="round"/>
    
    <!-- 刀尖闪光 -->
    <circle cx="256" cy="60" r="5" fill="#ffffff" filter="url(#glow)"/>
  </g>
</svg>
